{{- if and .Values.tunnel.token (not .Values.tunnel.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudflared.fullname" . }}-token
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tunnel.tokenKey }}: {{ .Values.tunnel.token | quote }}
{{- end }}
{{- if eq (include "cloudflared.mode" .) "config" }}
{{- if and .Values.config.credentials.file (not .Values.config.credentials.existingSecret) }}
{{- if and .Values.tunnel.token (not .Values.tunnel.existingSecret) }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudflared.fullname" . }}-credentials
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.credentials.key }}: {{ .Values.config.credentials.file | quote }}
{{- end }}
{{- end }}
