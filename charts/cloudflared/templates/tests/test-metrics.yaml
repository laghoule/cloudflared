{{- if and .Values.tests.enabled .Values.metrics.enabled .Values.metrics.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cloudflared.fullname" . }}-test-metrics
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      imagePullPolicy: IfNotPresent
      command:
        - curl
      args:
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "10"
        - http://{{ include "cloudflared.fullname" . }}-metrics:{{ .Values.metrics.port }}/metrics
{{- end }}
